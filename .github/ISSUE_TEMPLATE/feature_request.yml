name: Focused feature proposal
description: Propose an improvement to PatchOath's authority-to-evidence workflow.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: What question about an AI-assisted change is currently hard to answer?
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence-chain stage
      options:
        - Intent context
        - Execution authority / Change Contract
        - Observed Git or visual effect
        - Evidence integrity / verification
        - Mechanical review / Contract Delta
        - Historical human review
        - Disclosure boundary / Capsule
        - Guarded restore
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful solution
      description: Describe the narrowest complete workflow, not a platform-sized feature list.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Accuracy and product boundaries
      description: What could this misclassify, what authority must it not silently grant, and what should PatchOath explicitly not claim?
    validations:
      required: true
